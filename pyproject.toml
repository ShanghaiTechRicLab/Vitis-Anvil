[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13",
    "tqdm>=4.65",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock", "types-tqdm"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["anvil*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "fast: CPU-only tests (default selection)",
    "slow: tests that require FPGA toolchain",
]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*"]
ignore_missing_imports = true
