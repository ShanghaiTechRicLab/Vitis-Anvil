[board]
name        = "kv260"
device_kind = "embedded"
arch        = "aarch64"
vitis_part  = "xck26-sfvc784-2LV-c"
ddr_size_gb = 4

[vitis]
platform     = "xilinx_kv260_base_202420_1"
platform_dir = "${XILINX_VITIS}/base_platforms/xilinx_kv260_base_202420_1"
clock_hz     = 250_000_000
xclbin_mode  = "hw_emu"

[connect]
hp_ports = ["HP0"]

[deploy]
default_ip  = ""
ssh_user    = "root"
deploy_dir  = "~/anvil-deploy"
xrt_setup   = ". /etc/profile.d/xrt_setup.sh"
