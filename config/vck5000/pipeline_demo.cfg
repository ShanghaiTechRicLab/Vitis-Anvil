[connectivity]
nk=saxpy_stream:1:saxpy_stream_1
nk=vadd_stream:1:vadd_stream_1

# K2K streaming: saxpy_stream output -> vadd_stream input via AXI4-Stream.
sc=saxpy_stream_1.s_out:vadd_stream_1.s_in

# VCK5000 platform memory naming may vary by shell. Override this file if your
# installed shell exposes non-DDR memory names.
sp=saxpy_stream_1.x:DDR[0]
sp=saxpy_stream_1.y:DDR[1]
sp=vadd_stream_1.b:DDR[2]
sp=vadd_stream_1.out:DDR[3]

[clock]
freqHz=300000000:saxpy_stream_1
freqHz=300000000:vadd_stream_1
